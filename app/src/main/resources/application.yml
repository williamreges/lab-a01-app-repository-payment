server:
  port: 8000

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
     exposure:
       include: health, prometheus
     base-path: "/"
     path-mapping:
       prometheus: "metrics"
  metrics:
    tags:
      application:  service-app-repository-payment
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        transacao_pix_save: true
        transacao_pix_save_count: true
      percentiles:
        transacao_pix_save: 0.5,0.75,0.95,0.99
        transacao_pix_save_count: 0.5,0.75,0.95,0.99

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationID:-}] "
  include-application-name: false

spring:
  application:
    name: app-repository-payment
  cloud:
    config:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: update

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/payment-db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: password

  flyway:
    enabled: true
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/
    schemas: payment-db
    user: root
    password: password



