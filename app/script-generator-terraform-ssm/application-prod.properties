eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
server.port=8000
spring.application.name=app-repository-payment
spring.cloud.config.enabled=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/payment-db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password
spring.flyway.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.url=jdbc:mysql://localhost:3306/
spring.flyway.schemas=payment-db
spring.flyway.user=root
spring.flyway.password=password